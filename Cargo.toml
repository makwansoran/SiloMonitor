[package]
name = "silo-alert"
version = "1.0.0"
edition = "2021"

[dependencies]
rppal = "0.22.1"
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4.45", features = ["clock"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
