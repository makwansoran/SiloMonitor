camera:
  # "rtsp" for the Ethernet camera on site, "usb" for bench work.
  source: "usb"
  rtsp_url: ""
  device: 0
  width: 640
  height: 480
  # Decode rate. Low is fine — the model only looks each check interval.
  fps: 2

level:
  # One comparison against the empty reference every N seconds.
  check_interval_seconds: 15
  # The silo must look empty this long before the alert goes out.
  empty_confirmation_seconds: 15
  # How closely a frame must match the empty reference.
  # 0 = derive it from how alike the reference photos already are.
  empty_match_threshold: 0

storage:
  db_path: data/silo.db

radio:
  frequency_mhz: "446.0062"
  squelch: 1
  uart_port: "/dev/serial0"
  ptt_gpio: 17

supabase:
  enabled: true
  url: "https://mranicltlsnjurjqwjpv.supabase.co"
  # Prefer env SUPABASE_KEY — leave empty in committed configs when possible
  key: ""
  site_id: "spectr-pi"
